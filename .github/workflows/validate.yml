name: observability-validate

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform/observability init -backend=false
      - run: terraform -chdir=terraform/observability validate
      - name: Validate Grafana dashboard JSON
        run: python -m json.tool dashboards/platform-overview.json > /dev/null
